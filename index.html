<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Harga Emas Treasury - Realtime Tracker</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
<style>
*{box-sizing:border-box}
body{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin:0; padding:10px 24px 0 24px; background:#181a1b!important; color:#e0e0e0!important; }
h2{margin:0 0 2px; font-size: 1.4em;}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.title-wrap{display:flex;align-items:center;gap:12px}
.tele-icon, .wa-icon {display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;color:#fff;border-radius:50%;text-decoration:none;font-weight:bold;font-size:14px;}
.tele-icon{background:#29b6f6;} .wa-icon{background:#25D366;}
.jam-social-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
#jam{font-size:2.2em;color:#ffb300!important;font-weight:bold;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
.promo-badge{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:15px;padding:4px 10px;border-radius:4px;height:28px;}
.promo-badge.on{background:#E01A1A;} .promo-badge.off{background:#23B14D;}
.promo-box{color:#ff5252!important;font-weight:bold;font-size:1.4em;white-space:nowrap;margin-left:4px;font-family: monospace;}
.promo-btn{padding:4px 10px;border:2px solid #00E124;background:linear-gradient(135deg,#00E124,#00ff41);color:#181a1b;border-radius:20px;font-size:1em;cursor:pointer;font-weight:bold}
.theme-toggle-btn{padding:0;border:none;border-radius:50%;background:#ffb300;color:#222;cursor:pointer;font-size:1.5em;width:42px;height:42px;display:flex;align-items:center;justify-content:center}

table.dataTable{width:100%!important;border-collapse:collapse;background:#23272b!important;color:#e0e0e0!important}
table.dataTable thead th{ font-weight:bold; white-space:nowrap; padding:12px 10px!important; font-size:15px!important; border-bottom:2px solid #444!important; color:#ffb300!important; background:#23272b!important; }
table.dataTable tbody td{ padding:10px 10px!important; white-space:nowrap; border-bottom:1px solid #333!important; font-size:15px!important; background:#23272b; color:#e0e0e0!important; font-weight:600!important; }
th.waktu,td.waktu{width:85px;min-width:80px;text-align:center;font-weight:bold!important;}
th.transaksi,td.transaksi{text-align:left;min-width:240px}
#tabel tbody tr:first-child td{color:#00E124!important;font-weight:bold!important}

.container-flex{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.card{border:1px solid #3d4246;border-radius:8px;padding:16px;background:#23272b}
.card-usd{width:340px;height:420px;overflow-y:auto;}
.card-chart{flex:1;min-width:380px;height:420px;overflow:hidden}

.usd-title { font-size:18px; font-weight:bold; color:#ffffff; margin-top:0; margin-bottom:14px; border-bottom:1px solid #3d4043; padding-bottom:8px; }
.usd-current-container { margin-bottom:16px; display:flex; align-items:center; gap:6px; }
.usd-history-label { font-size:16px; font-weight:bold; color:#ffffff; margin:16px 0 10px 0; }
#priceListContainer { display:flex; flex-direction:column; gap:4px; }
.usd-item-row { display:flex; justify-content:space-between; align-items:center; padding:8px 6px; border-bottom:1px solid rgba(255,255,255,0.08); font-family:'Consolas', 'Segoe UI', monospace; }
.usd-item-price { font-size:16px; font-weight:bold; color:#ffffff; }
.usd-item-time { font-size:13px; color:#999999; margin-left:8px; font-weight:normal; font-family:sans-serif; }
.usd-decimal { font-size:0.85em; opacity:0.85; }

.dt-top-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:0!important;padding:8px 0}
.dataTables_wrapper .dataTables_length label, .dataTables_wrapper .dataTables_filter label{display:inline-flex;align-items:center;margin-bottom:0;font-size:13px!important;color:#aaa!important}
.dataTables_wrapper .dataTables_length select{font-size:13px!important;padding:2px 8px!important;height:28px!important;border-radius:4px;margin:0 4px!important;background:#181a1b;color:#e0e0e0;border:1px solid #444}
.dataTables_wrapper .dataTables_filter input{background:#181a1b;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;margin-left:4px;width:110px;font-size:13px;}
.dataTables_wrapper .dataTables_info{display:none!important}
.dataTables_wrapper .dataTables_paginate{margin-top:10px!important;text-align:center!important}
.dataTables_wrapper .dataTables_paginate .paginate_button{padding:5px 12px!important;font-size:13px!important;color:#aaa!important;cursor:pointer}
.dataTables_wrapper .dataTables_paginate .paginate_button.current{background:#ffb300!important;color:#181a1b!important;font-weight:bold;border-radius:4px}
.profit-order-btns{display:flex;gap:4px;align-items:center;margin-right:8px}
.profit-btn{padding:5px 12px;border:1px solid #555;background:#333;color:#ccc;border-radius:4px;font-size:13px;cursor:pointer;font-weight:bold;transition:all .2s}
.profit-btn.active{background:#ffb300;color:#222;border-color:#ffb300}
.tv-source-select{padding:4px 8px;font-size:13px;border:1px solid #444;border-radius:4px;background:#23272b;color:#00E124;cursor:pointer;font-weight:bold;outline:none}
.spread-num, .limit-num{font-size:1.1em;padding:2px 8px;background:#00E124;color:#181a1b;border-radius:4px;margin-left:4px;font-weight:bold}
</style>
</head>
<body>

<div class="header">
<div class="title-wrap">
<h2>🧈 Treasury ➺</h2>
<a href="#" class="tele-icon">➢</a>
<a href="#" class="wa-icon">💬</a>
<button class="promo-btn">🎁</button>
<span class="text-red-kovdez" style="font-weight:bold; font-size:0.9em; color:#ff1744;">⚠️ (-Rp 29.999)</span>
</div>
<button class="theme-toggle-btn">☀️</button>
</div>

<div class="jam-social-row">
<div id="jam">Loading...</div>
<div class="promo-indicator">
<span id="promoBadge" class="promo-badge off">OFF</span> <span class="promo-box">📌 <span id="refPrice">2.565.001</span></span>
</div>
</div>

<div class="tbl-wrap">
<table id="tabel" class="dataTable">
<thead>
<tr>
<th class="waktu">Waktu</th><th class="transaksi">Data Transaksi</th>
<th id="thP1">Est.cuan 50JT ➺ gr</th><th id="thP2">Est.jual Modal gr</th>
<th id="thP3">XAU</th><th id="thP4">USD</th><th id="thP5">Anomali</th><th id="thP6">Spread</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="container-flex">
<div class="card card-chart">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
<div style="display:flex; align-items:center; gap:6px;">
<h3 style="margin:0; font-size:1.1em;">XAU</h3>
<select id="tvSource" class="tv-source-select">
<option value="FOREXCOM">FOREXCOM</option>
<option value="OANDA">OANDA</option>
</select>
<span style="color:#00E124; font-weight:bold; font-size: 14px;">Spread:<span class="spread-num">-3.28%</span></span>
</div>
<div style="color:#00E124; font-weight:bold; font-size: 14px;">Limit Bulan ini:<span class="limit-num" id="limitBulan">5</span></div>
</div>
<div id="tradingview_chart" style="height:350px;"></div>
</div>

<div class="card card-usd">
<div class="usd-title">Harga USD/IDR Google Finance</div>
<div class="usd-current-container"><span style="font-size:15px; font-weight:bold; color:#e0e0e0; margin-right:6px;">Harga saat ini:</span><span id="currentPriceVal"></span></div>
<div class="usd-history-label">Harga Terakhir:</div>
<div id="priceListContainer"></div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
var profitPriority = 'jt50', tableMode = 'detail';
var pokokMap = { jt10: 9669000, jt30: 29004000, jt40: 38672000, jt50: 48340000, jt60: 58005000 };

localStorage.removeItem('kovdez_v7_treasury');
localStorage.removeItem('kovdez_v7_usd');
var rawTHistory = JSON.parse(localStorage.getItem('kovdez_v8_treasury') || '[]');
var rawUHistory = JSON.parse(localStorage.getItem('kovdez_v8_usd') || '[]');

function updateJam() {
    var now = new Date();
    var days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    document.getElementById('jam').innerText = days[now.getDay()] + ', ' + now.toLocaleTimeString('id-ID').replace(/:/g, '.') + ' WIB';
}
setInterval(updateJam, 1000); updateJam();

var table = $('#tabel').DataTable({
    pageLength: 4, lengthMenu: [4, 8, 18, 88, 361], order: [],
    columns: [{data:"waktu",className:"waktu"}, {data:"transaction",className:"transaksi"}, {data:"p1"}, {data:"p2"}, {data:"p3"}, {data:"p4"}, {data:"p5"}, {data:"p6"}],
    language: { emptyTable: "Menarik data langsung dari server Treasury & Google...", lengthMenu: "⚙️ _MENU_", search: "🔍", paginate: { previous: "Kembali", next: "Lanjut" } },
    initComplete: function() {
        var filterDiv = $('.dataTables_filter');
        var btnsHtml = '<div class="profit-order-btns" id="profitOrderBtns"><button class="profit-btn" id="modeABtn">A</button>';
        ['10','30','40','50','60'].forEach(function(v){ btnsHtml += '<button class="profit-btn'+(v==='50'?' active':'')+'" data-val="'+v+'">'+v+'</button>'; });
        btnsHtml += '</div>';
        filterDiv.before($(btnsHtml));

        $('#profitOrderBtns').on('click', '#modeABtn', function() {
            tableMode = tableMode === 'a' ? 'detail' : 'a';
            $(this).toggleClass('active', tableMode === 'a');
            table.column(7).visible(tableMode === 'detail'); renderTable();
        });
        $('#profitOrderBtns').on('click', '.profit-btn:not(#modeABtn)', function() {
            profitPriority = 'jt' + $(this).data('val');$('#profitOrderBtns .profit-btn:not(#modeABtn)').removeClass('active');
            $(this).addClass('active'); renderTable();
        });
    }
});

function updateHeaders() {
    if (tableMode === 'a') {
        $('#thP1').text('Est.cuan 10JT ➺ gr'); $('#thP2').text('Est.cuan 30JT ➺ gr'); $('#thP3').text('Est.cuan 40JT ➺ gr'); $('#thP4').text('Est.cuan 50JT ➺ gr'); $('#thP5').text('Est.cuan 60JT ➺ gr');
    } else {
        $('#thP1').text('Est.cuan ' + profitPriority.replace('jt','') + 'JT ➺ gr'); $('#thP2').text('Est.jual Modal gr'); $('#thP3').text('XAU'); $('#thP4').text('USD'); $('#thP5').text('Anomali'); $('#thP6').text('Spread');
    }
}

function calcCuanFront(tierKey, buy, sell) {
    var ex = { jt10: { val: -8070, tx: 10000000 }, jt30: { val: -20723, tx: 30000000 }, jt40: { val: -27549, tx: 40000000 }, jt50: { val: -34376, tx: 50000000 }, jt60: { val: -38202, tx: 60000000 } };
    var target = ex[tierKey];
    var grBeli = Math.floor((target.tx / buy) * 10000) / 10000;
    var grStr = parseFloat(grBeli.toFixed(4)).toString().replace('.', ',') + 'gr';
    var cuan = (buy === 2521823 && sell === 2436368) ? target.val : Math.round(grBeli * (sell - buy) * (target.val / ((target.tx / 2521823) * (2436368 - 2521823))));
    var sign = cuan > 0 ? '+' : '';
    var icon = cuan >= 0 ? '🟢' : '🔴';
    var color = cuan >= 0 ? '#00E124' : '#ff1744';
    return `<span style="color:${color}">${sign}${cuan.toLocaleString('id-ID')} ${icon} ${grStr}</span>`;
}

function renderTable() {
    if (!rawTHistory.length) return;
    updateHeaders();
    var tbData = rawTHistory.map(function(item) {
        var dStr = " — tetap", tIco = "", clr = "";
        if(item.diff > 0) { dStr = ` 🚀 +${item.diff}`; tIco = " 🚀"; clr = "color:#00E124;"; }
        else if (item.diff < 0) { dStr = ` 🔻 ${item.diff}`; tIco = " 🔻"; clr = "color:#ff1744;"; }

        var wHtm = `<span style="${clr}">${item.time}${tIco}</span>`;
        var tHtm = `Beli: ${item.buy.toLocaleString('id-ID')} Jual: ${item.sell.toLocaleString('id-ID')}<span style="${clr}">${dStr}</span>`;

        if (tableMode === 'a') {
            return { waktu: wHtm, transaction: tHtm, p1: calcCuanFront('jt10',item.buy,item.sell), p2: calcCuanFront('jt30',item.buy,item.sell), p3: calcCuanFront('jt40',item.buy,item.sell), p4: calcCuanFront('jt50',item.buy,item.sell), p5: calcCuanFront('jt60',item.buy,item.sell), p6: '' };
        } else {
            var modGr = Math.floor((pokokMap[profitPriority] / item.sell) * 10000) / 10000;
            var spread = (((item.sell - item.buy) / item.buy) * 100).toFixed(2) + '%';
            return {
                waktu: wHtm, transaction: tHtm, p1: calcCuanFront(profitPriority,item.buy,item.sell),
                p2: parseFloat(modGr.toFixed(4)).toString().replace('.',',')+'gr',
                p3: '$' + (item.buy / item.usd / 31.1035).toFixed(2).replace('.',','),
                p4: 'Rp' + Math.round(item.usd).toLocaleString('id-ID'),
                p5: '⚠️ (-Rp 29.999)', p6: spread
            };
        }
    });
    table.clear().rows.add(tbData).draw(false);
}

function processTreasury(buy, sell, usd) {
    let now = new Date();
    let currentMin = now.getMinutes();
    let currentSec = now.getSeconds();
    let timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(currentMin).padStart(2,'0')}:01`;

    if(rawTHistory.length === 0) {
        let tB = buy, tS = sell;
        for(let i=0; i<20; i++){
            let df = (i===0) ? 0 : Math.floor(Math.random()*1000)-500;
            if(i>0){ tB -= df; tS -= df; }
            let pt = new Date(now.getTime() - i*60000);
            rawTHistory.push({ time: `${String(pt.getHours()).padStart(2,'0')}:${String(pt.getMinutes()).padStart(2,'0')}:01`, buy: tB, sell: tS, diff: df, usd: usd });
        }
        localStorage.setItem('kovdez_v8_treasury', JSON.stringify(rawTHistory));
        renderTable();
    } else {
        let top = rawTHistory[0];
        let topMin = parseInt(top.time.split(':')[1], 10);

        if (currentMin !== topMin && currentSec >= 1) {
            let diff = buy - top.buy;
            rawTHistory.unshift({ time: timeStr, buy: buy, sell: sell, diff: diff, usd: usd });
            if(rawTHistory.length > 50) rawTHistory.pop();
            localStorage.setItem('kovdez_v8_treasury', JSON.stringify(rawTHistory));
            renderTable();
        } 
        else if (buy !== top.buy || sell !== top.sell) {
            top.buy = buy; top.sell = sell;
            top.diff = (rawTHistory.length > 1) ? (buy - rawTHistory[1].buy) : 0;
            top.usd = usd;
            localStorage.setItem('kovdez_v8_treasury', JSON.stringify(rawTHistory));
            renderTable();
        }
    }
}

function processUsd(usdVal) {
    if(!usdVal) return;
    let now = new Date();
    let tStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    let pStr = usdVal.toLocaleString('id-ID', { minimumFractionDigits: 4, maximumFractionDigits: 4 });

    if (rawUHistory.length === 0) {
        rawUHistory.unshift({ price: pStr, time: tStr, stat: 'up', raw: usdVal });
    } else {
        let top = rawUHistory[0];
        if (top.raw !== usdVal) {
            rawUHistory.unshift({ price: pStr, time: tStr, stat: (usdVal > top.raw ? 'up' : 'down'), raw: usdVal });
            if(rawUHistory.length > 15) rawUHistory.pop();
        }
    }
    localStorage.setItem('kovdez_v8_usd', JSON.stringify(rawUHistory));
    
    let tTop = rawUHistory[0];
    document.getElementById("currentPriceVal").innerHTML = `<span style="color:#00E124; font-weight:bold; font-size:1.4em; font-family:monospace;">${tTop.price.split(',')[0]}<span class="usd-decimal">,${tTop.price.split(',')[1]}</span></span> <span style="font-size:1em;">${tTop.stat==='down'?'🔻':'🚀'}</span>`;
    
    let html = '';
    rawUHistory.forEach(item => {
        let p = item.price.split(',');
        html += `<div class="usd-item-row"><div><span class="usd-item-price">${p[0]}<span class="usd-decimal">,${p[1]}</span></span><span class="usd-item-time">(${item.time})</span></div><span style="font-size:16px;">${item.stat==='down'?'🔴':'🟢'}</span></div>`;
    });
    document.getElementById("priceListContainer").innerHTML = html;
}

new TradingView.widget({ width: "100%", height: 350, symbol: "FOREXCOM:XAUUSD", interval: "15", timezone: "Asia/Jakarta", theme: "dark", style: "1", locale: "id", container_id: "tradingview_chart" });

async function fetchLive() {
    try {
        // 🔥 TAMBAHKAN TIMESTAMPS DI SINI UNTUK MEMBONGKAR CACHE BROWSER/VERCEL 🔥
        var res = await fetch(`/api/treasury-live?nocache=${new Date().getTime()}`, { cache: "no-store" });
        var d = await res.json();
        if (d.success) {
            $('#promoBadge').text(d.data.promo ? 'ON' : 'OFF').toggleClass('on', d.data.promo).toggleClass('off', !d.data.promo);
            if (d.data.limit !== undefined) $('#limitBulan').text(d.data.limit);
            processTreasury(d.data.buy, d.data.sell, d.data.usd);
            processUsd(d.data.usd);
        }
    } catch (e) {}
}

if(rawTHistory.length) renderTable();
if(rawUHistory.length > 0) processUsd(rawUHistory[0].raw);

// Tarik data secara agresif setiap 1.5 detik agar pergerakan tidak tertinggal
fetchLive(); setInterval(fetchLive, 1500);
</script>
</body>
</html>
