<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harga Emas Treasury - Realtime Monitor</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 12px 20px; 
            background: #121314; 
            color: #e0e0e0; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Navigation & Top Bar */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .title-wrap { display: flex; align-items: center; gap: 8px; }
        .tele-icon, .wa-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; text-decoration: none; font-weight: bold; font-size: 13px; }
        .tele-icon { background: #0088cc; } .wa-icon { background: #25D366; }
        .promo-btn { padding: 3px 9px; border: none; background: #ff1744; color: #fff; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .theme-toggle-btn { width: 36px; height: 36px; border-radius: 50%; background: #ffb300; border: none; font-size: 1.2em; cursor: pointer; }
        
        #jam { font-size: 1.7em; color: #ffb300; font-weight: bold; font-family: monospace; }
        .promo-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-weight: bold; color: #fff; font-size: 13px; text-transform: uppercase; }
        .promo-badge.off { background: #23B14D; }
        .promo-badge.on { background: #E01A1A; animation: promoBlink 0.6s infinite alternate; }
        @keyframes promoBlink { 0% { opacity: 1; } 100% { opacity: 0.6; } }
        .promo-box { color: #ff5252; font-weight: bold; font-size: 1.15em; margin-left: 6px; font-family: monospace; }

        /* Datatable High Contrast & Spacing */
        .tbl-wrap { width: 100%; overflow-x: auto; margin-bottom: 16px; border-radius: 6px; border: 1px solid #2a2c2e; }
        table.dataTable { width: 100%!important; border-collapse: collapse; background: #1a1c1e!important; color: #e0e0e0!important; margin-top: 0!important; }
        table.dataTable thead th { color: #ffb300!important; border-bottom: 2px solid #333!important; padding: 10px 12px; font-size: 13px; text-align: left; white-space: nowrap; font-weight: 700; }
        table.dataTable tbody td { border-bottom: 1px solid #26282a!important; padding: 9px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; font-family: monospace; }
        
        /* Control Bar Kovdez Top Left/Right */
        .dt-top-controls { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1a1c1e; border-bottom: 1px solid #2a2c2e; flex-wrap: wrap; gap: 8px; }
        .dataTables_length label, .dataTables_filter label { color: #aaa!important; font-size: 12px; display: inline-flex; align-items: center; }
        .dataTables_length select { background: #121314; color: #fff; border: 1px solid #3d4043; border-radius: 4px; padding: 3px 6px; margin: 0 4px; }
        .dataTables_filter input { background: #121314; color: #fff; border: 1px solid #3d4043; border-radius: 4px; padding: 4px 8px; margin-left: 4px; width: 110px; outline: none; }
        .dataTables_paginate { text-align: center; margin-top: 10px; margin-bottom: 6px; }
        .dataTables_paginate .paginate_button { color: #aaa!important; padding: 4px 10px!important; font-size: 12px!important; cursor: pointer; border-radius: 4px; }
        .dataTables_paginate .paginate_button.current { background: #ffb300!important; color: #121314!important; font-weight: bold; }
        .dataTables_info { display: none!important; }

        .profit-order-btns { display: inline-flex; gap: 4px; align-items: center; margin-left: 10px; }
        .profit-btn { padding: 4px 10px; border: 1px solid #3d4043; background: #26282a; color: #ccc; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .profit-btn.active { background: #ffb300; color: #121314; border-color: #ffb300; }
        
        .text-green-kovdez { color: #00E124!important; }
        .text-red-kovdez { color: #ff1744!important; }
        
        /* Grid Layout Bottom Cards */
        .container-flex { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
        .card { border: 1px solid #2a2c2e; border-radius: 8px; padding: 14px; background: #1a1c1e; }
        .card-chart { flex: 2; min-width: 320px; height: 390px; }
        .card-usd { flex: 1; min-width: 260px; height: 390px; overflow-y: auto; }
        
        /* USD/IDR Widget Styling */
        .usd-decimal { font-size: 0.85em; opacity: 0.75; }
        .usd-header-box { background: #121314; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #2a2c2e; }
        .usd-list-wrap { display: flex; flex-direction: column; gap: 2px; }
        .usd-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 4px; font-family: monospace; font-size: 0.88em; border-bottom: 1px solid #222426; }
        .usd-item:hover { background: rgba(255, 255, 255, 0.03); }
        
        .tv-source-select { background: #121314; color: #00E124; border: 1px solid #3d4043; border-radius: 4px; font-weight: bold; padding: 3px 6px; font-size: 0.85em; }
        .spread-num { background: #ff1744; color: #fff; padding: 2px 7px; border-radius: 4px; font-weight: bold; margin-left: 4px; }
        .limit-num { background: #00E124; color: #121314; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-left: 4px; }
    </style>
</head>
<body>

    <!-- Header Atas -->
    <div class="header">
        <div class="title-wrap">
            <h2 style="margin:0; font-size: 1.25em;">🧈 Treasury ➺</h2>
            <a href="#" class="tele-icon">➢</a>
            <a href="#" class="wa-icon">💬</a>
            <button class="promo-btn">🎁</button>
            <span id="anomaliDisplay" class="text-red-kovdez" style="font-weight:bold; font-size:0.85em;">⚠️ (-Rp 29.999)</span>
        </div>
        <button class="theme-toggle-btn">☀️</button>
    </div>

    <!-- Jam & Status Promo -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <div id="jam">Loading...</div>
        <div style="display:flex; align-items:center;">
            <span id="promoBadge" class="promo-badge off">OFF</span>
            <span class="promo-box">📌 <span id="refPrice">2.565.001</span></span>
        </div>
    </div>

    <!-- Tabel Live Monitoring Kovdez -->
    <div class="tbl-wrap">
        <table id="tabel" class="dataTable">
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Data Transaksi</th>
                    <th id="thP1">Est.cuan 30JT ➺ gr</th>
                    <th id="thP2">Est.jual Modal gr</th>
                    <th id="thP3">XAU</th>
                    <th id="thP4">USD</th>
                    <th id="thP5">Anomali</th>
                    <th id="thP6">Spread</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Grid Chart TradingView & Panel Google Finance USD/IDR -->
    <div class="container-flex">
        <div class="card card-chart">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:6px;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <h3 style="margin:0; font-size:1em;">XAU</h3>
                    <select id="tvSource" class="tv-source-select">
                        <option value="FOREXCOM">FOREXCOM</option>
                        <option value="OANDA">OANDA</option>
                        <option value="BYBIT:XAUTUSDT">XAUT-Bybit</option>
                    </select>
                    <span style="color:#ff1744; font-weight:bold; font-size:0.88em;">Spread:<span class="spread-num" id="spreadValue">-3.39%</span></span>
                </div>
                <div style="color:#00E124; font-weight:bold; font-size:0.88em;">
                    Limit Bulan ini:<span class="limit-num" id="limitBulan">5</span>
                </div>
            </div>
            <div id="tradingview_chart" style="height:320px;"></div>
        </div>

        <div class="card card-usd">
            <h3 style="margin-top:0; font-size:0.95em; color:#e0e0e0; margin-bottom:10px; font-weight:bold;">Harga USD/IDR Google Finance</h3>
            <div class="usd-header-box">
                <div style="font-size:0.78em; color:#888; text-transform:uppercase; font-weight:bold; letter-spacing:0.5px;">Harga saat ini</div>
                <div id="currentPrice" class="text-green-kovdez" style="font-weight:bold; font-size:1.15em; margin-top:2px; font-family:monospace;">
                    17.914<span class="usd-decimal">,1000</span> 🚀
                </div>
            </div>
            <h4 style="margin:8px 0 6px; font-size:0.82em; color:#888; text-transform:uppercase; font-weight:bold;">Harga Terakhir:</h4>
            <div id="priceListContainer" class="usd-list-wrap">
                <!-- Data Rendered Dynamic via JS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>

    <script>
        var profitPriority = 'jt30';
        var tableMode = 'detail';
        var pokokMap = { jt10: 9669000, jt30: 29004000, jt40: 38672000, jt50: 48340000, jt60: 58005000 };
        var headerLabels = {'jt10':'Est.cuan 10JT ➺ gr','jt30':'Est.cuan 30JT ➺ gr','jt40':'Est.cuan 40JT ➺ gr','jt50':'Est.cuan 50JT ➺ gr','jt60':'Est.cuan 60JT ➺ gr'};
        var latestHistory = [];

        function updateJam() {
            var now = new Date();
            var days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            document.getElementById('jam').innerText = days[now.getDay()] + ', ' + now.toLocaleTimeString('id-ID') + ' WIB';
        }
        setInterval(updateJam, 1000); updateJam();

        var table = $('#tabel').DataTable({
            pageLength: 4,
            lengthMenu: [4, 8, 18, 88, 361],
            order: [],
            columns: [
                { data: "waktu" }, { data: "transaction" },
                { data: "p1" }, { data: "p2" }, { data: "p3" }, { data: "p4" }, { data: "p5" }, { data: "p6" }
            ],
            language: {
                emptyTable: "Menunggu data...",
                lengthMenu: "⚙️ _MENU_",
                search: "🔍",
                paginate: { previous: "Kembali", next: "Lanjut" }
            },
            initComplete: function() {
                var filterDiv = $('.dataTables_filter');
                var btnsHtml = '<div class="profit-order-btns" id="profitOrderBtns"><button class="profit-btn" id="modeABtn">A</button>';
                ['10','30','40','50','60'].forEach(function(v){
                    btnsHtml += '<button class="profit-btn'+(v==='30'?' active':'')+'" data-val="'+v+'">'+v+'</button>';
                });
                btnsHtml += '</div>';
                filterDiv.before($(btnsHtml));

                $('#profitOrderBtns').on('click', '#modeABtn', function() {
                    tableMode = tableMode === 'a' ? 'detail' : 'a';
                    $(this).toggleClass('active', tableMode === 'a');
                    table.column(7).visible(tableMode === 'detail');
                    renderTable();
                });

                $('#profitOrderBtns').on('click', '.profit-btn:not(#modeABtn)', function() {
                    profitPriority = 'jt' + $(this).data('val');$('#profitOrderBtns .profit-btn:not(#modeABtn)').removeClass('active');
                    $(this).addClass('active');
                    renderTable();
                });
            }
        });

        function updateHeaders() {
            if (tableMode === 'a') {
                $('#thP1').text(headerLabels['jt10']); $('#thP2').text(headerLabels['jt30']);
                $('#thP3').text(headerLabels['jt40']); $('#thP4').text(headerLabels['jt50']);
                $('#thP5').text(headerLabels['jt60']);
            } else {
                var num = profitPriority.replace('jt','');
                $('#thP1').text('Est.cuan ' + num + 'JT ➺ gr'); $('#thP2').text('Est.jual Modal gr');
                $('#thP3').text('XAU'); $('#thP4').text('USD'); $('#thP5').text('Anomali'); $('#thP6').text('Spread');
            }
        }

        function renderTable() {
            if (!latestHistory.length) return;
            updateHeaders();
            var arr = [];

            if (tableMode === 'a') {
                arr = latestHistory.map(function(d) {
                    return {
                        waktu: `<span class="text-red-kovdez">${d.waktu_display}</span>`,
                        transaction: `<span class="text-green-kovdez">Beli: ${d.buying_rate} Jual: ${d.selling_rate}</span>${d.diff_display}`,
                        p1: d.jt10, p2: d.jt30, p3: d.jt40, p4: d.jt50, p5: d.jt60, p6: ''
                    };
                });
            } else {
                var pokok = pokokMap[profitPriority];
                arr = latestHistory.map(function(d) {
                    var modalGr = Math.floor((pokok / d.selling_rate_raw) * 10000) / 10000;
                    var modalGrStr = parseFloat(modalGr.toFixed(4)).toString().replace('.',',') + 'gr';
                    var spreadPct = (((d.selling_rate_raw - d.buying_rate_raw) / d.buying_rate_raw) * 100).toFixed(2) + '%';
                    
                    return {
                        waktu: `<span class="text-red-kovdez">${d.waktu_display}</span>`,
                        transaction: `<span class="text-green-kovdez">Beli: ${d.buying_rate} Jual: ${d.selling_rate}</span>${d.diff_display}`,
                        p1: d[profitPriority],
                        p2: `<span class="text-green-kovdez">${modalGrStr}</span>`,
                        p3: `<span class="text-green-kovdez">$${(d.usd_price_buy * 31.1035).toFixed(2).replace('.',',')}</span>`,
                        p4: `<span class="text-green-kovdez">Rp${d.usdidr.toLocaleString('id-ID')}</span>`,
                        p5: `⚠️ (-Rp 29.999)`,
                        p6: `<span class="text-red-kovdez">${spreadPct}</span>`
                    };
                });
            }
            table.clear().rows.add(arr).draw(false);
        }

        function formatUsdFormat(strPrice) {
            var parts = strPrice.split(',');
            if (parts.length > 1) {
                return parts[0] + '<span class="usd-decimal">,' + parts[1] + '</span>';
            }
            return strPrice;
        }

        function renderUsdPanel(usdList) {
            if (!usdList || !usdList.length) return;
            
            var top = usdList[0];
            $('#currentPrice').html(formatUsdFormat(top.price) + ' 🚀');

            var html = '';
            usdList.forEach(function(item) {
                var icon = item.status === 'up' ? '🟢' : (item.status === 'down' ? '🔴' : '➖');
                html += `
                    <div class="usd-item">
                        <span style="color:#e0e0e0; font-weight:600;">${formatUsdFormat(item.price)}</span>
                        <span style="color:#777; font-size:0.8em;">(${item.time}) ${icon}</span>
                    </div>
                `;
            });
            $('#priceListContainer').html(html);
        }

        function createTradingViewWidget() {
            var src = $('#tvSource').val() || 'FOREXCOM';
            var sym = src.indexOf(':') !== -1 ? src : src + ':XAUUSD';
            new TradingView.widget({
                width: "100%", height: 320, symbol: sym, interval: "15",
                timezone: "Asia/Jakarta", theme: "dark", style: "1", locale: "id",
                container_id: "tradingview_chart"
            });
        }
        createTradingViewWidget();
        $('#tvSource').change(createTradingViewWidget);

        async function fetchLiveData() {
            try {
                var res = await fetch('/api/treasury-live');
                var d = await res.json();
                
                if (d.success) {
                    $('#promoBadge').text(d.promo_status ? 'ON' : 'OFF').toggleClass('on', d.promo_status === 1).toggleClass('off', d.promo_status !== 1);
                    if (d.promo_price) $('#refPrice').text(d.promo_price);
                    if (d.limit_bulan !== undefined) $('#limitBulan').text(d.limit_bulan);
                    
                    if (d.history && d.history.length) {
                        latestHistory = d.history;
                        renderTable();
                    }

                    if (d.usd_idr_history) {
                        renderUsdPanel(d.usd_idr_history);
                    }
                }
            } catch (e) {}
        }

        setInterval(fetchLiveData, 3000); fetchLiveData();
    </script>
</body>
</html>
