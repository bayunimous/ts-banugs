<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Harga Emas Treasury - TradingView Sync Dashboard</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
<style>
*{box-sizing:border-box}
body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin:0;
    padding:10px 24px 0 24px;
    background:#181a1b!important;
    color:#e0e0e0!important;
    -webkit-font-smoothing: antialiased;
}
h2{margin:0 0 2px; font-size: 1.4em;}

.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.title-wrap{display:flex;align-items:center;gap:12px}
.tele-icon, .wa-icon {display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;color:#fff;border-radius:50%;text-decoration:none;font-weight:bold;font-size:14px;}
.tele-icon{background:#29b6f6;}
.wa-icon{background:#25D366;}

.jam-social-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
#jam{font-size:2.2em;color:#ffb300!important;font-weight:bold;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
.promo-badge{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:15px;padding:4px 10px;border-radius:4px;height:28px;}
.promo-badge.on{background:#E01A1A;}
.promo-badge.off{background:#23B14D;}
.promo-box{color:#ff5252!important;font-weight:bold;font-size:1.4em;white-space:nowrap;margin-left:4px;font-family: monospace;}
.promo-btn{padding:4px 10px;border:2px solid #00E124;background:linear-gradient(135deg,#00E124,#00ff41);color:#181a1b;border-radius:20px;font-size:1em;cursor:pointer;font-weight:bold}
.theme-toggle-btn{padding:0;border:none;border-radius:50%;background:#ffb300;color:#222;cursor:pointer;font-size:1.5em;width:42px;height:42px;display:flex;align-items:center;justify-content:center}

/* DataTable Kovdez Styling & Font Diperbesar */
table.dataTable{width:100%!important;border-collapse:collapse;background:#23272b!important;color:#e0e0e0!important}
table.dataTable thead th{
    font-weight:bold;
    white-space:nowrap;
    padding:12px 10px!important;
    font-size:15px!important;
    border-bottom:2px solid #444!important;
    color:#ffb300!important;
    background:#23272b!important;
}
table.dataTable tbody td{
    padding:10px 10px!important;
    white-space:nowrap;
    border-bottom:1px solid #333!important;
    font-size:15px!important;
    background:#23272b;
    color:#e0e0e0!important;
    font-weight:600!important;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
th.waktu,td.waktu{width:85px;min-width:80px;text-align:center;font-weight:bold!important;}
th.transaksi,td.transaksi{text-align:left;min-width:240px}

/* Baris Pertama Warna Neon Green Kovdez */
#tabel tbody tr:first-child td{color:#00E124!important;font-weight:bold!important}

.container-flex{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.card{border:1px solid #3d4246;border-radius:8px;padding:16px;background:#23272b}
.card-usd{width:340px;height:420px;overflow-y:auto;background:#23272b;}
.card-chart{flex:1;min-width:380px;height:420px;overflow:hidden}

/* USD/IDR Card Panel Kovdez Exact Design */
.usd-title { font-size:18px; font-weight:bold; color:#ffffff; margin-top:0; margin-bottom:14px; border-bottom:1px solid #3d4043; padding-bottom:8px; }
.usd-current-label { font-size:15px; font-weight:bold; color:#e0e0e0; display:inline-block; margin-right:6px; }
.usd-current-container { margin-bottom:16px; display:flex; align-items:center; gap:6px; }
.usd-history-label { font-size:16px; font-weight:bold; color:#ffffff; margin:16px 0 10px 0; }

#priceListContainer { display:flex; flex-direction:column; gap:4px; }
.usd-item-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 6px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-family:'Consolas', 'Segoe UI', monospace;
}
.usd-item-price { font-size:16px; font-weight:bold; color:#ffffff; }
.usd-item-time { font-size:13px; color:#999999; margin-left:8px; font-weight:normal; font-family:sans-serif; }
.usd-decimal { font-size:0.85em; opacity:0.85; }

.dt-top-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:0!important;padding:8px 0}
.dataTables_wrapper .dataTables_length label, .dataTables_wrapper .dataTables_filter label{display:inline-flex;align-items:center;margin-bottom:0;font-size:13px!important;color:#aaa!important}
.dataTables_wrapper .dataTables_length select{font-size:13px!important;padding:2px 8px!important;height:28px!important;border-radius:4px;margin:0 4px!important;background:#181a1b;color:#e0e0e0;border:1px solid #444}
.dataTables_wrapper .dataTables_filter input{background:#181a1b;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;margin-left:4px;width:110px;font-size:13px;}
.dataTables_wrapper .dataTables_info{display:none!important}
.dataTables_wrapper .dataTables_paginate{margin-top:10px!important;text-align:center!important}
.dataTables_wrapper .dataTables_paginate .paginate_button{padding:5px 12px!important;font-size:13px!important;color:#aaa!important;cursor:pointer}
.dataTables_wrapper .dataTables_paginate .paginate_button.current{background:#ffb300!important;color:#181a1b!important;font-weight:bold;border-radius:4px}

.profit-order-btns{display:flex;gap:4px;align-items:center;margin-right:8px}
.profit-btn{padding:5px 12px;border:1px solid #555;background:#333;color:#ccc;border-radius:4px;font-size:13px;cursor:pointer;font-weight:bold;transition:all .2s}
.profit-btn.active{background:#ffb300;color:#222;border-color:#ffb300}
.tv-source-select{padding:4px 8px;font-size:13px;border:1px solid #444;border-radius:4px;background:#23272b;color:#00E124;cursor:pointer;font-weight:bold;outline:none}
.spread-num{font-size:1.1em;padding:2px 8px;background:#00E124;color:#181a1b;border-radius:4px;margin-left:4px;font-weight:bold}
.limit-num{font-size:1.1em;padding:2px 8px;background:#00E124;color:#181a1b;border-radius:4px;margin-left:4px;font-weight:bold}
.text-green-kovdez{color:#00E124!important}
.text-red-kovdez{color:#ff1744!important}
</style>
</head>
<body>

<div class="header">
<div class="title-wrap">
<h2>🧈 Treasury ➺</h2>
<a href="#" class="tele-icon">➢</a>
<a href="#" class="wa-icon">💬</a>
<button class="promo-btn">🎁</button>
<span id="anomaliDisplay" class="text-red-kovdez" style="font-weight:bold; font-size:0.9em;">⚠️ (-Rp 29.999)</span>
</div>
<button class="theme-toggle-btn">☀️</button>
</div>

<div class="jam-social-row">
<div id="jam">Loading...</div>
<div class="promo-indicator">
<span id="promoBadge" class="promo-badge off">OFF</span> <span class="promo-box">📌 <span id="refPrice">2.565.001</span></span>
</div>
</div>

<div class="tbl-wrap">
<table id="tabel" class="dataTable">
<thead>
<tr>
<th class="waktu">Waktu</th>
<th class="transaksi">Data Transaksi</th>
<th id="thP1">Est.cuan 50JT ➺ gr</th>
<th id="thP2">Est.jual Modal gr</th>
<th id="thP3">XAU</th>
<th id="thP4">USD</th>
<th id="thP5">Anomali</th>
<th id="thP6">Spread</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="container-flex">
<div class="card card-chart">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
<div style="display:flex; align-items:center; gap:6px;">
<h3 style="margin:0; font-size:1.1em;">XAU</h3>
<select id="tvSource" class="tv-source-select">
<option value="FOREXCOM">FOREXCOM</option>
<option value="OANDA">OANDA</option>
<option value="BYBIT:XAUTUSDT">XAUT-Bybit</option>
</select>
<span style="color:#00E124; font-weight:bold; font-size: 14px;">Spread:<span class="spread-num" id="spreadValue">-3.39%</span></span>
</div>
<div style="color:#00E124; font-weight:bold; font-size: 14px;">
Limit Bulan ini:<span class="limit-num" id="limitBulan">5</span>
</div>
</div>
<div id="tradingview_chart" style="height:350px;"></div>
</div>

<div class="card card-usd">
<div class="usd-title">Harga USD/IDR Google Finance</div>
<div class="usd-current-container">
    <span class="usd-current-label">Harga saat ini:</span>
    <span id="currentPriceVal"></span>
</div>
<div class="usd-history-label">Harga Terakhir:</div>
<div id="priceListContainer"></div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
var profitPriority = 'jt50';
var tableMode = 'detail';
var pokokMap = { jt10: 9669000, jt30: 29004000, jt40: 38672000, jt50: 48340000, jt60: 58005000 };
var headerLabels = {'jt10':'Est.cuan 10JT ➺ gr','jt30':'Est.cuan 30JT ➺ gr','jt40':'Est.cuan 40JT ➺ gr','jt50':'Est.cuan 50JT ➺ gr','jt60':'Est.cuan 60JT ➺ gr'};
var latestHistory = [];

// Bersihkan TOTAL semua cache lama di browser pengguna
localStorage.removeItem('kovdez_usd_history');
localStorage.removeItem('kovdez_usd_history_v2');
localStorage.removeItem('kovdez_usd_history_v3');
localStorage.removeItem('kovdez_usd_real_log');

var usdTradingViewLog = JSON.parse(localStorage.getItem('tv_usd_history_v4') || '[]');

function formatUsdDisplay(priceStr) {
    if(!priceStr) return '';
    var parts = String(priceStr).split(',');
    if(parts.length > 1) {
        return parts[0] + '<span class="usd-decimal">,' + parts[1] + '</span>';
    }
    return priceStr;
}

function updateJam() {
    var now = new Date();
    var days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    document.getElementById('jam').innerText = days[now.getDay()] + ', ' + now.toLocaleTimeString('id-ID') + ' WIB';
}
setInterval(updateJam, 1000); updateJam();

var table = $('#tabel').DataTable({
    pageLength: 4,
    lengthMenu: [4, 8, 18, 88, 361],
    order: [],
    columns: [
        { data: "waktu", className: "waktu" },
        { data: "transaction", className: "transaksi" },
        { data: "p1" }, { data: "p2" }, { data: "p3" }, { data: "p4" }, { data: "p5" }, { data: "p6" }
    ],
    language: { emptyTable: "Menunggu data...", lengthMenu: "⚙️ _MENU_", search: "🔍", paginate: { previous: "Kembali", next: "Lanjut" } },
    initComplete: function() {
        var filterDiv = $('.dataTables_filter');
        var btnsHtml = '<div class="profit-order-btns" id="profitOrderBtns"><button class="profit-btn" id="modeABtn">A</button>';
        ['10','30','40','50','60'].forEach(function(v){
            btnsHtml += '<button class="profit-btn'+(v==='50'?' active':'')+'" data-val="'+v+'">'+v+'</button>';
        });
        btnsHtml += '</div>';
        filterDiv.before($(btnsHtml));

        $('#profitOrderBtns').on('click', '#modeABtn', function() {
            tableMode = tableMode === 'a' ? 'detail' : 'a';
            $(this).toggleClass('active', tableMode === 'a');
            table.column(7).visible(tableMode === 'detail');
            renderTable();
        });

        $('#profitOrderBtns').on('click', '.profit-btn:not(#modeABtn)', function() {
            profitPriority = 'jt' + $(this).data('val');$('#profitOrderBtns .profit-btn:not(#modeABtn)').removeClass('active');
            $(this).addClass('active');
            renderTable();
        });
    }
});

function updateHeaders() {
    if (tableMode === 'a') {
        $('#thP1').text(headerLabels['jt10']); $('#thP2').text(headerLabels['jt30']);
        $('#thP3').text(headerLabels['jt40']); $('#thP4').text(headerLabels['jt50']);
        $('#thP5').text(headerLabels['jt60']);
    } else {
        var num = profitPriority.replace('jt','');
        $('#thP1').text('Est.cuan ' + num + 'JT ➺ gr'); $('#thP2').text('Est.jual Modal gr');
        $('#thP3').text('XAU'); $('#thP4').text('USD'); $('#thP5').text('Anomali'); $('#thP6').text('Spread');
    }
}

function renderTable() {
    if (!latestHistory.length) return;
    updateHeaders();
    var arr = [];

    if (tableMode === 'a') {
        arr = latestHistory.map(function(d) {
            return {
                waktu: d.waktu_display,
                transaction: 'Beli: ' + d.buying_rate + ' Jual: ' + d.selling_rate + d.diff_display,
                p1: d.jt10, p2: d.jt30, p3: d.jt40, p4: d.jt50, p5: d.jt60, p6: ''
            };
        });
    } else {
        var pokok = pokokMap[profitPriority];
        arr = latestHistory.map(function(d) {
            var modalGr = Math.floor((pokok / d.selling_rate_raw) * 10000) / 10000;
            var modalGrStr = parseFloat(modalGr.toFixed(4)).toString().replace('.',',') + 'gr';
            var spreadPct = (((d.selling_rate_raw - d.buying_rate_raw) / d.buying_rate_raw) * 100).toFixed(2) + '%';
            
            return {
                waktu: d.waktu_display,
                transaction: 'Beli: ' + d.buying_rate + ' Jual: ' + d.selling_rate + d.diff_display,
                p1: d[profitPriority],
                p2: modalGrStr,
                p3: '$' + d.usd_price_buy.toFixed(2).replace('.',','),
                p4: 'Rp' + d.usdidr.toLocaleString('id-ID'),
                p5: '⚠️ (-Rp 29.999)',
                p6: spreadPct
            };
        });
    }
    table.clear().rows.add(arr).draw(false);
}

// PENANGANAN HARGA REALTIME TRADINGVIEW
function processTradingViewData(usdData) {
    if (!usdData || !usdData.price || !usdData.raw) return;

    var priceFormatted = usdData.price;
    var rawVal = usdData.raw;
    var timeStr = usdData.time;

    if (usdTradingViewLog.length === 0) {
        usdTradingViewLog.unshift({
            price: priceFormatted,
            time: timeStr,
            status: 'up',
            raw: rawVal
        });
        localStorage.setItem('tv_usd_history_v4', JSON.stringify(usdTradingViewLog));
        renderUsdUI();
        return;
    }

    var latestStored = usdTradingViewLog[0];

    // HANYA BERTAMBAH JIKA ADA PERGERAKAN HARGA DARI TRADINGVIEW
    if (rawVal !== latestStored.raw) {
        var status = (rawVal > latestStored.raw) ? 'up' : 'down';

        usdTradingViewLog.unshift({
            price: priceFormatted,
            time: timeStr,
            status: status,
            raw: rawVal
        });

        if (usdTradingViewLog.length > 15) {
            usdTradingViewLog.pop();
        }

        localStorage.setItem('tv_usd_history_v4', JSON.stringify(usdTradingViewLog));
        renderUsdUI();
    } else {
        renderUsdCurrentOnly();
    }
}

function renderUsdCurrentOnly() {
    if (usdTradingViewLog.length === 0) return;
    var top = usdTradingViewLog[0];
    var currentIcon = (top.status === 'down') ? '🔻' : '🚀';
    document.getElementById("currentPriceVal").innerHTML = 
        `<span style="color:#00E124; font-weight:bold; font-size:1.4em; font-family:monospace;">${formatUsdDisplay(top.price)}</span> <span style="font-size:1em;">${currentIcon}</span>`;
}

function renderUsdUI() {
    if (usdTradingViewLog.length === 0) return;

    renderUsdCurrentOnly();

    var html = '';
    usdTradingViewLog.forEach(function(item) {
        var icon = (item.status === 'down') ? '🔴' : '🟢';
        html += `
            <div class="usd-item-row">
                <div>
                    <span class="usd-item-price">${formatUsdDisplay(item.price)}</span>
                    <span class="usd-item-time">(${item.time})</span>
                </div>
                <span style="font-size:16px;">${icon}</span>
            </div>
        `;
    });
    document.getElementById("priceListContainer").innerHTML = html;
}

function createTradingViewWidget() {
    var src = $('#tvSource').val() || 'FOREXCOM';
    var sym = src.indexOf(':') !== -1 ? src : src + ':XAUUSD';
    new TradingView.widget({
        width: "100%", height: 350, symbol: sym, interval: "15",
        timezone: "Asia/Jakarta", theme: "dark", style: "1", locale: "id",
        container_id: "tradingview_chart"
    });
}
createTradingViewWidget();
$('#tvSource').change(createTradingViewWidget);

async function fetchLiveData() {
    try {
        var res = await fetch('/api/treasury-live');
        var d = await res.json();
        
        if (d.success) {
            $('#promoBadge').text(d.promo_status ? 'ON' : 'OFF').toggleClass('on', d.promo_status === 1).toggleClass('off', d.promo_status !== 1);
            if (d.promo_price) $('#refPrice').text(d.promo_price);
            if (d.limit_bulan !== undefined) $('#limitBulan').text(d.limit_bulan);
            
            if (d.history && d.history.length) {
                latestHistory = d.history;
                renderTable();
            }

            if (d.google_finance_usd) {
                processTradingViewData(d.google_finance_usd);
            }
        }
    } catch (e) {}
}

renderUsdUI();
setInterval(fetchLiveData, 3000); fetchLiveData();
</script>
</body>
</html>
